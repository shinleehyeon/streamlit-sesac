# Stock Peer layout 유지, 색만 차분한 다크로 조정
[theme]
base = "dark"

textColor = "#e8eef4"
primaryColor = "#38bdf8"
backgroundColor = "#0f1419"
secondaryBackgroundColor = "#1a2332"

showWidgetBorder = true
borderColor = "#2a3544"

dataframeHeaderBackgroundColor = "#1a2332"

font = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
baseFontWeight = 300
baseFontSize = 14

headingFont = "Space Grotesk"
headingFontWeights = [300, 400, 400, 300, 300, 300]
headingFontSizes = ["2.5rem", "1.5rem", "1rem"]
